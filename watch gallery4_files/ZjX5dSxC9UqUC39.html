 with a simple twist. No matter, your hands are wet or you&#39;re on the move, the intuitive functional crown makes navigation easy and effortless.","Health &amp; Wellness Tracking: Wave Call 3 continuously monitors your heart rate and blood oxygen saturation (SpO2), keeps an eye on your sleep quality, and supports stress management with guided breathing sessions. You’ll also receive timely reminders to move, hydrate, and take mindful breaks, ensuring your physical, mental, and emotional well-being.","Multiple Sports Modes: From running and yoga to cycling and cricket, choose an activity and let the watch handle the sports tracking. Monitor calories, heart rate, and distance, just like having a personal fitness coach.","Female Wellness: Receive on-time menstrual and ovulation reminders to stay in tune with your body’s rhythm. The female wellness features help you to stay prepared and in control of your wellness journey.","IP68 Dust, Splash &amp; Sweat Resistance: With IP68 protection, your watch can handle dust, sweat, and accidental splashes with ease. No worries about rain or sweat splashes.","Call, Text &amp; App Notifications: Receive calls, texts, and social media notifications right on your wrist, perfect for when your phone is in your bag or another room.","Music &amp; Camera Control: Switch tracks, adjust volume during a jog or click group pictures hands-free with Wave Call 3. With music and camera controls on your wrist, convenience is literally at your fingertips."],"links":[{"url":"/Wave-Smartwatch-Animated-Functional-Multiple/dp/B0FLF38P8G"}],"productCategory":{"glProductGroup":{"symbol":"gl_pc"},"productType":"WEARABLE_COMPUTER","productCategoryId":"14700900","productSubcategoryId":"14700948"},"prices":{"mainPrice":{"price":{"currency":{"amount":1399,"currencyCode":"INR","displayString":"&#8377;1399.0"},"currencyRange":{},"pricePerUnit":{"baseValueAmount":0},"type":"BUYING","label":"Price:","addToCartUrl":"https://www.amazon.in/advertising/atc?ie=UTF8&t
